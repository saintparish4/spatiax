version: '3.8'

services:
  telemetry-system:
    build: .
    container_name: telemetry-system
    restart: unless-stopped
    ports:
      - "8080:8080"  # Dashboard
      - "8888:8888"  # UDP telemetry input
    volumes:
      - ./config:/app/config
      - ./data:/app/data
      - ./logs:/app/logs
      - /sys/class/net:/sys/class/net:ro  # For CAN interface detection
    environment:
      - RUST_LOG=info
      - TELEMETRY_CONFIG=/app/config/telemetry.json
    networks:
      - telemetry-net
    privileged: true  # Required for CAN bus access
    devices:
      - /dev/net/tun  # For network interfaces
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Redis for caching and session storage
  redis:
    image: redis:7-alpine
    container_name: telemetry-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - telemetry-net
    command: redis-server --appendonly yes

  # InfluxDB for time-series data storage
  influxdb:
    image: influxdb:2.7-alpine
    container_name: telemetry-influxdb
    restart: unless-stopped
    ports:
      - "8086:8086"
    volumes:
      - influxdb-data:/var/lib/influxdb2
      - ./config/influxdb:/etc/influxdb2
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=telemetry123
      - DOCKER_INFLUXDB_INIT_ORG=telemetry
      - DOCKER_INFLUXDB_INIT_BUCKET=sensor-data
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=telemetry-admin-token
    networks:
      - telemetry-net

  # Grafana for advanced visualization
  grafana:
    image: grafana/grafana:10.0.0
    container_name: telemetry-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./config/grafana:/etc/grafana/provisioning
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=telemetry123
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource
    networks:
      - telemetry-net
    depends_on:
      - influxdb

  # Prometheus for metrics collection
  prometheus:
    image: prom/prometheus:latest
    container_name: telemetry-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - telemetry-net

  # MQTT broker for IoT device communication
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: telemetry-mqtt
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./config/mosquitto:/mosquitto/config
      - mosquitto-data:/mosquitto/data
      - mosquitto-logs:/mosquitto/log
    networks:
      - telemetry-net

  # CAN bus simulator for testing
  can-simulator:
    build: 
      context: .
      dockerfile: Dockerfile.can-simulator
    container_name: telemetry-can-sim
    restart: unless-stopped
    privileged: true
    networks:
      - telemetry-net
    depends_on:
      - telemetry-system
    profiles:
      - simulation

volumes:
  redis-data:
  influxdb-data:
  grafana-data:
  prometheus-data:
  mosquitto-data:
  mosquitto-logs:

networks:
  telemetry-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
