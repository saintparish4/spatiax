name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  check:
    name: fmt / clippy / test / doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Clippy (library only, no clap)
        run: cargo clippy --all-targets --no-default-features -- -D warnings

      - name: Test
        run: cargo test --all-features
        env:
          PROPTEST_CASES: 16384

      - name: Docs
        run: cargo doc --no-deps --all-features

  live:
    name: live capture on vcan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Bring up a virtual CAN interface
        run: |
          # The runner's Azure kernel ships without the CAN modules; the
          # extra-modules package for that exact kernel has them.
          sudo apt-get update -qq
          sudo apt-get install -y -qq "linux-modules-extra-$(uname -r)"
          sudo modprobe vcan
          sudo ip link add dev vcan0 type vcan
          sudo ip link set vcan0 mtu 72
          sudo ip link set up vcan0

      - name: Capture from vcan0 with the library and the binary
        run: cargo test --features socketcan --test live -- --nocapture
        env:
          SPATIAX_VCAN: vcan0
          SPATIAX_REQUIRE_VCAN: "1"

  differential:
    name: differential vs cantools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the reference decoder
        run: pip install cantools==43.0.2

      - name: Decode generated databases with both implementations
        run: cargo test --test differential -- --nocapture
        env:
          SPATIAX_REQUIRE_ORACLE: "1"
          SPATIAX_DIFFERENTIAL_CASES: "500000"

      - name: Regenerate the demo lap and compare it with the committed log
        run: python3 scripts/synthetic_lap.py --check

  bench:
    name: benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run the benchmarks
        run: cargo bench --bench decode

      - name: Publish the table in the job summary
        run: python3 scripts/bench_table.py | tee -a "$GITHUB_STEP_SUMMARY"

  msrv:
    name: minimum supported rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
      - name: Build on MSRV
        run: cargo build --all-targets --all-features
