name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  check:
    name: fmt / clippy / test / doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Clippy (library only, no clap)
        run: cargo clippy --all-targets --no-default-features -- -D warnings

      - name: Test
        run: cargo test --all-features
        env:
          PROPTEST_CASES: 16384

      - name: Docs
        run: cargo doc --no-deps

  differential:
    name: differential vs cantools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the reference decoder
        run: pip install cantools==43.0.2

      - name: Decode generated databases with both implementations
        run: cargo test --test differential -- --nocapture
        env:
          SPATIAX_REQUIRE_ORACLE: "1"
          SPATIAX_DIFFERENTIAL_CASES: "500000"

  msrv:
    name: minimum supported rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
      - name: Build on MSRV
        run: cargo build --all-targets
