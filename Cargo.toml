[workspace]
members = [
    "telemetry-core",
    "telemetry-ingestion", 
    "telemetry-analysis",
    "telemetry-ml",
    "telemetry-alerts",
    "telemetry-dashboard",
    "telemetry-can",
    "telemetry-protocols"
]

[workspace.dependencies]
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
crossbeam = "0.8"
rayon = "1.7"
ndarray = "0.15"
candle = "0.3"
tch = "0.13"
plotters = "0.3"
axum = "0.7"
tower = "0.4"
tower-http = "0.5"
dashmap = "5.5"
parking_lot = "0.12"
byteorder = "1.4"
crc = "3.0"
ringbuf = "0.3"
