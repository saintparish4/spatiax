[package]
name = "spatiax"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "A fast, provably correct CAN bus / DBC decoder for motorsport telemetry"
repository = "https://github.com/saintparish4/spatiax"
keywords = ["can", "dbc", "canbus", "telemetry", "motorsport"]
categories = ["parser-implementations", "embedded"]
readme = "README.md"

[features]
default = ["cli"]
# The `spatiax` binary. Library users can turn it off to keep clap out of
# their dependency tree.
cli = ["dep:clap"]
# Live capture from a SocketCAN interface: the `live` module and, with
# `cli`, the `spatiax live` command. Does nothing off Linux.
socketcan = ["dep:socketcan"]

[dependencies]
thiserror = "2"
clap = { version = "4", features = ["derive"], optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
socketcan = { version = "3", default-features = false, optional = true }

[dev-dependencies]
proptest = "1"
rand = "0.9"
# No plots: the numbers go through `scripts/bench_table.py`, and dropping
# `plotters` and `rayon` keeps the bench build small.
criterion = { version = "0.7", default-features = false, features = ["cargo_bench_support"] }

[[bin]]
name = "spatiax"
required-features = ["cli"]

[[bench]]
name = "decode"
harness = false

[profile.release]
lto = "thin"
codegen-units = 1

# I keep symbols in bench builds so a profiler can attribute samples to functions.
[profile.bench]
debug = true
