[package]
name = "spatiax"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "A fast, provably correct CAN bus / DBC decoder for motorsport telemetry"
repository = "https://github.com/saintparish4/spatial"
keywords = ["can", "dbc", "canbus", "telemetry", "motorsport"]
categories = ["parser-implementations", "embedded"]
readme = "README.md"

[features]
default = ["cli"]
# The `spatiax` binary. Library users can turn it off to keep clap out of
# their dependency tree.
cli = ["dep:clap"]

[dependencies]
thiserror = "2"
clap = { version = "4", features = ["derive"], optional = true }

[dev-dependencies]
proptest = "1"
rand = "0.9"

[[bin]]
name = "spatiax"
required-features = ["cli"]

[profile.release]
lto = "thin"
codegen-units = 1

# I keep symbols in bench builds so a profiler can attribute samples to functions.
[profile.bench]
debug = true
